name: Publish npm package
description: Test and publish the same tarball, then verify the public package
inputs:
  package:
    description: core or cli
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
        package-manager-cache: false
    - name: Check package version and main ancestry
      shell: bash
      env:
        PACKAGE_SLUG: ${{ inputs.package }}
      run: |
        node .github/scripts/npm-release.mjs check "$PACKAGE_SLUG"
        git fetch --no-tags origin main
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main
    - name: Require successful exact-SHA CI
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        passed="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" -f branch=main -f event=push -f head_sha="$GITHUB_SHA" -F per_page=100 --jq ".workflow_runs | any(.head_sha == \"${GITHUB_SHA}\" and .status == \"completed\" and .conclusion == \"success\")")"
        test "$passed" = true
    - shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build, pack once and test the release tarball
      shell: bash
      env:
        PACKAGE_SLUG: ${{ inputs.package }}
      run: |
        pnpm --filter "$RELEASE_PACKAGE" build
        mkdir -p "$RUNNER_TEMP/npm-release"
        pnpm --filter "$RELEASE_PACKAGE" pack --pack-destination "$RUNNER_TEMP/npm-release"
        node ".github/scripts/${PACKAGE_SLUG}-pack-smoke.mjs" "$RELEASE_TARBALL"
    - name: Record dist-tags and check publication
      shell: bash
      run: |
        npm view "$RELEASE_PACKAGE" dist-tags --json --workspaces=false --registry=https://registry.npmjs.org > "$RUNNER_TEMP/npm-tags-before.json"
        npm publish "$RELEASE_TARBALL" --dry-run --tag "$RELEASE_DIST_TAG" --access public --ignore-scripts --registry=https://registry.npmjs.org
    - name: Publish the tested tarball using npm trusted publishing
      shell: bash
      working-directory: packages/${{ inputs.package }}
      run: npm publish "$RELEASE_TARBALL" --tag "$RELEASE_DIST_TAG" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
    - name: Verify registry metadata and the published tarball
      shell: bash
      env:
        PACKAGE_SLUG: ${{ inputs.package }}
      run: |
        node .github/scripts/wait-npm-release.mjs
        npm view "$RELEASE_PACKAGE@$RELEASE_VERSION" dist --json --workspaces=false --registry=https://registry.npmjs.org > "$RUNNER_TEMP/npm-dist.json"
        npm view "$RELEASE_PACKAGE" dist-tags --json --workspaces=false --registry=https://registry.npmjs.org > "$RUNNER_TEMP/npm-tags-after.json"
        node .github/scripts/npm-release.mjs verify "$PACKAGE_SLUG"
        mkdir -p "$RUNNER_TEMP/npm-registry"
        npm pack "$RELEASE_PACKAGE@$RELEASE_VERSION" --ignore-scripts --workspaces=false --registry=https://registry.npmjs.org --pack-destination "$RUNNER_TEMP/npm-registry"
        downloaded="$RUNNER_TEMP/npm-registry/$(basename "$RELEASE_TARBALL")"
        cmp "$RELEASE_TARBALL" "$downloaded"
        node ".github/scripts/${PACKAGE_SLUG}-pack-smoke.mjs" "$downloaded"
