name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://vibelog:local-vibelog@127.0.0.1:5432/vibelog
      TEST_OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
      TEST_OBJECT_STORE_REGION: us-east-1
      TEST_OBJECT_STORE_BUCKET: vibelog
      TEST_OBJECT_STORE_ACCESS_KEY_ID: minioadmin
      TEST_OBJECT_STORE_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL and MinIO
        run: |
          docker compose up --detach --wait postgres minio
          docker compose up minio-init
      - run: pnpm check
      - name: Verify Drizzle baseline is current
        run: |
          pnpm --filter @vibelog/app db:generate
          git diff --exit-code -- packages/app/src/drizzle
          test -z "$(git status --porcelain -- packages/app/src/drizzle)"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Stop integration services
        if: always()
        run: docker compose down --volumes

  pulumi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vibelog/edge build
      - run: pnpm --filter @vibelog/infra build
      - run: pnpm --filter @vibelog/infra test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate Compose manifests
        run: |
          docker compose config --quiet
          docker compose --env-file .env.selfhost.example -f compose.selfhost.yml config --quiet
      - name: Build and smoke test stateless application containers
        env:
          VIBELOG_APP_IMAGE: vibelog-app:ci
          NODE_ENV: production
          APP_ORIGIN: http://app.localtest.me:34123
          BETTER_AUTH_SECRET: vibelog-ci-secret-that-is-at-least-thirty-two-chars
          VIBELOG_AI_PROVIDER: openai
          VIBELOG_AI_MODEL: gpt-4o-mini
          PORT: 34123
        run: |
          trap 'docker compose down --volumes' EXIT
          docker compose up --detach --build postgres minio minio-init migrate web worker
          node .github/scripts/container-smoke.mjs
