name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:build
      - name: Smoke test packaged core and CLI
        run: node .github/scripts/package-smoke.mjs
      - name: Smoke test compiled SaaS server
        env:
          NODE_ENV: production
          APP_ORIGIN: https://app.example
          PREVIEW_ORIGIN: https://preview.example
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          OIDC_ISSUER: https://issuer.example
          OIDC_CLIENT_ID: test
          OIDC_CLIENT_SECRET: test
          OIDC_REDIRECT_URI: https://app.example/auth/callback
          DATA_ROOT: ${{ runner.temp }}/vibelog-data
          PORT: 34123
        run: |
          node packages/app/dist/server.js &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:34123/health && exit 0
            sleep 1
          done
          exit 1
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
