name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request supersedes its running CI; main runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://vibelog:local-vibelog@127.0.0.1:5432/vibelog
      TEST_OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
      TEST_OBJECT_STORE_REGION: us-east-1
      TEST_OBJECT_STORE_BUCKET: vibelog
      TEST_OBJECT_STORE_ACCESS_KEY_ID: minioadmin
      TEST_OBJECT_STORE_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL and S3 mock
        run: |
          docker compose up --detach --wait postgres s3mock
      - run: pnpm check
      - name: Verify Drizzle baseline is current
        run: |
          pnpm --filter @vibelog/app db:generate
          git diff --exit-code -- packages/app/src/drizzle
          test -z "$(git status --porcelain -- packages/app/src/drizzle)"
      - run: pnpm build
      - name: Verify compiled edge signature compatibility
        run: node .github/scripts/edge-signature-smoke.mjs
      - name: Pack public packages once on Node 26
        run: |
          mkdir -p "$RUNNER_TEMP/package-smoke"
          pnpm --filter @vibelog/core pack --pack-destination "$RUNNER_TEMP/package-smoke"
          pnpm --filter @vibelog/cli pack --pack-destination "$RUNNER_TEMP/package-smoke"
      - name: Verify public packages on Node 26
        run: |
          node .github/scripts/cli-pack-smoke.mjs "$RUNNER_TEMP/package-smoke"/vibelog-cli-*.tgz
          node .github/scripts/core-pack-smoke.mjs "$RUNNER_TEMP/package-smoke"/vibelog-core-*.tgz
      - name: Use Node 24 for public package compatibility
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify the same public packages on Node 24
        run: |
          node .github/scripts/cli-pack-smoke.mjs "$RUNNER_TEMP/package-smoke"/vibelog-cli-*.tgz
          node .github/scripts/core-pack-smoke.mjs "$RUNNER_TEMP/package-smoke"/vibelog-core-*.tgz
      - name: Stop integration services
        if: always()
        run: docker compose down --volumes

  # The browser suite is the slowest part of CI, so it runs beside the checks instead of after them.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the application image with the shared layer cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/app/Dockerfile
          tags: vibelog-app:e2e
          load: true
          cache-from: type=gha,scope=app-image
          cache-to: type=gha,scope=app-image,mode=max,ignore-error=true
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          VIBELOG_E2E_PREBUILT: '1'
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop integration services
        if: always()
        run: docker compose down --volumes

  # Keeps the single `verify` status that branch protection and reviewers already expect.
  verify:
    if: always()
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the checks and the browser suite
        env:
          RESULTS: ${{ needs.check.result }} ${{ needs.e2e.result }}
        run: test "$RESULTS" = "success success"

  pulumi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vibelog/edge build
      - run: pnpm --filter @vibelog/infra build
      - run: pnpm --filter @vibelog/infra test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Validate Compose manifests
        run: |
          docker compose config --quiet
          docker compose --env-file .env.selfhost.example -f compose.selfhost.yml config --quiet
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the application image with the shared layer cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/app/Dockerfile
          tags: vibelog-app:ci
          load: true
          cache-from: type=gha,scope=app-image
          cache-to: type=gha,scope=app-image,mode=max,ignore-error=true
      - name: Smoke test stateless application containers
        env:
          VIBELOG_APP_IMAGE: vibelog-app:ci
          NODE_ENV: production
          APP_ORIGIN: http://app.localtest.me:34123
          BETTER_AUTH_SECRET: vibelog-ci-secret-that-is-at-least-thirty-two-chars
          VIBELOG_AI_PROVIDER: openai
          VIBELOG_AI_MODEL: gpt-4o-mini
          PORT: 34123
        run: |
          trap 'docker compose down --volumes' EXIT
          docker compose up --detach --no-build postgres s3mock migrate web worker
          node .github/scripts/container-smoke.mjs
