name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify generated Drizzle migrations are current
        run: |
          pnpm --filter @vibelog/app db:generate
          git diff --exit-code -- packages/app/src/drizzle
          test -z "$(git status --porcelain -- packages/app/src/drizzle)"
      - run: pnpm build
      - run: pnpm docs:build
      - name: Smoke test packaged core and CLI
        run: node .github/scripts/package-smoke.mjs
      - name: Build and smoke test fat app container
        env:
          VIBELOG_APP_IMAGE: vibelog-app:ci
          NODE_ENV: production
          APP_ORIGIN: http://localhost:34123
          PREVIEW_ORIGIN: http://preview.localhost:34123
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BETTER_AUTH_SECRET: vibelog-ci-secret-that-is-at-least-thirty-two-chars
          PORT: 34123
        run: |
          trap 'docker compose down --volumes' EXIT
          wait_for_app() {
            for _ in $(seq 1 60); do
              if node -e "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"; then
                return 0
              fi
              sleep 1
            done
            docker compose logs app
            return 1
          }
          docker compose up --detach --build
          wait_for_app
          test "$(docker image inspect "$VIBELOG_APP_IMAGE" --format '{{json .Config.Cmd}}')" = '["node","dist/main.js"]'
          test "$(docker compose exec -T app node -p 'process.getuid()')" != "0"
          docker compose exec -T app node --input-type=module -e "import { randomUUID } from 'node:crypto'; import { writeFileSync } from 'node:fs'; import { AppDatabase } from './dist/database.js'; import { user } from './dist/schema.js'; const db=new AppDatabase('/data'); const userId=randomUUID(); const timestamp=new Date(); db.db.insert(user).values({id:userId,name:'smoke',email:'smoke@users.vibelog.invalid',emailVerified:false,username:'smoke',displayUsername:'smoke',createdAt:timestamp,updatedAt:timestamp}).run(); const project=db.createProject({userId,name:'smoke',slug:'smoke',sourceType:'hackmd',sourceConfig:{}}); const job=db.createJob(userId,project.id,'delete'); writeFileSync('/data/smoke-job',JSON.stringify({jobId:job.id,userId})); db.close()"
          job_complete=false
          for _ in $(seq 1 30); do
            if docker compose exec -T app node --input-type=module -e "import { readFileSync } from 'node:fs'; import { AppDatabase } from './dist/database.js'; const db=new AppDatabase('/data'); const {jobId,userId}=JSON.parse(readFileSync('/data/smoke-job','utf8')); const status=db.getJob(jobId,userId)?.status; db.close(); process.exit(status==='succeeded'?0:1)"; then
              job_complete=true
              break
            fi
            sleep 1
          done
          test "$job_complete" = true
          docker compose exec -T app node -e "require('node:fs').writeFileSync('/data/persistence-smoke','ok')"
          docker compose restart app
          wait_for_app
          docker compose exec -T app node -e "if(require('node:fs').readFileSync('/data/persistence-smoke','utf8')!=='ok')process.exit(1)"
          container_id="$(docker compose ps --all --quiet app)"
          docker compose stop --timeout 10 app
          test "$(docker inspect "$container_id" --format '{{.State.ExitCode}}')" = "0"
