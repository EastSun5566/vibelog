name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify Drizzle baseline is current
        run: |
          pnpm --filter @vibelog/app db:generate
          git diff --exit-code -- packages/app/src/drizzle
          test -z "$(git status --porcelain -- packages/app/src/drizzle)"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build and smoke test the fat container
        env:
          VIBELOG_APP_IMAGE: vibelog-app:ci
          NODE_ENV: production
          APP_ORIGIN: http://app.localtest.me:34123
          BETTER_AUTH_SECRET: vibelog-ci-secret-that-is-at-least-thirty-two-chars
          VIBELOG_AI_PROVIDER: openai
          VIBELOG_AI_MODEL: gpt-4o-mini
          PORT: 34123
        run: |
          trap 'docker compose down --volumes' EXIT
          docker compose up --detach --build
          node .github/scripts/container-smoke.mjs
