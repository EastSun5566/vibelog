name: Publish app image

on:
  push:
    tags: "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image version
        id: image
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and publish multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/eastsun5566/vibelog-app:${{ steps.image.outputs.version }}
            ghcr.io/eastsun5566/vibelog-app:beta
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
      - name: Verify both architectures and anonymous pull
        run: |
          docker buildx imagetools inspect "ghcr.io/eastsun5566/vibelog-app:${{ steps.image.outputs.version }}" | grep --quiet 'linux/amd64'
          docker buildx imagetools inspect "ghcr.io/eastsun5566/vibelog-app:${{ steps.image.outputs.version }}" | grep --quiet 'linux/arm64'
          docker logout ghcr.io
          docker pull "ghcr.io/eastsun5566/vibelog-app:${{ steps.image.outputs.version }}"
