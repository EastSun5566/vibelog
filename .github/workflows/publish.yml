name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmDrained:
        description: Confirm Cloud Tasks is empty and old worker requests have finished before locking
        type: boolean
        default: false
      confirmResume:
        description: Confirm the data migration and locked deployment are verified before reopening
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write
  packages: write

concurrency:
  group: deploy-vibelog-prod
  cancel-in-progress: false

env:
  PULUMI_STACK: EastSun5566/vibelog/prod
  PULUMI_ENABLE_STREAMING_JSON_PREVIEW: "true"
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Require successful CI for the selected main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_passed="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$DEPLOY_SHA" -F per_page=1 \
            --jq '.workflow_runs[0] | .status == "completed" and .conclusion == "success"')"
          if test "$ci_passed" != true; then
            echo "::error::CI must finish successfully for ${DEPLOY_SHA} on main before deployment."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: docker/setup-buildx-action@v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vibelog/core build
      - run: pnpm --filter @vibelog/app build
      - run: pnpm --filter @vibelog/edge build
      - run: pnpm --filter @vibelog/infra build
      - name: Authenticate with Pulumi Cloud using GitHub OIDC
        uses: pulumi/auth-actions@v2
        with:
          organization: EastSun5566
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:EastSun5566
      - name: Load short-lived GCP credentials and secrets from ESC
        uses: pulumi/esc-action@v3
        with:
          environment: EastSun5566/vibelog/prod
      - name: Validate deployment environment
        run: |
          test "$(pnpm exec pulumi config get vibelog:deploymentPhase --cwd packages/infra --stack "$PULUMI_STACK")" = application
          test -n "$GOOGLE_OAUTH_ACCESS_TOKEN"
      - name: Guard maintenance stage transition
        id: maintenance
        run: |
          desired_stage="$(pnpm exec pulumi config get vibelog:maintenanceStage --cwd packages/infra --stack "$PULUMI_STACK")"
          current_stage="$(pnpm exec pulumi stack output --json --cwd packages/infra --stack "$PULUMI_STACK" | jq -r '.maintenanceStage // ""')"
          node .github/scripts/guard-maintenance-stage.mjs "$current_stage" "$desired_stage" '${{ inputs.confirmDrained }}' '${{ inputs.confirmResume }}'
          echo "previous=$current_stage" >> "$GITHUB_OUTPUT"
          echo "value=$desired_stage" >> "$GITHUB_OUTPUT"
      - name: Verify drained database before locking
        if: steps.maintenance.outputs.previous == 'draining' && steps.maintenance.outputs.value == 'locked'
        run: |
          database_migration_url="$(pnpm exec pulumi stack output databaseMigrationUrl --show-secrets --cwd packages/infra --stack "$PULUMI_STACK")"
          test -n "$database_migration_url"
          echo "::add-mask::$database_migration_url"
          export DATABASE_MIGRATION_URL="$database_migration_url"
          node packages/app/scripts/check-rollout-drain.ts
      - name: Refuse V2 deployment before locked conversion
        run: |
          previous_design="$(pnpm exec pulumi stack output --json --cwd packages/infra --stack "$PULUMI_STACK" | jq -r '.presentationVersion // ""')"
          if test "$previous_design" != 2; then
            test '${{ steps.maintenance.outputs.previous }}' = locked
            test '${{ steps.maintenance.outputs.value }}' = locked
          fi
          database_migration_url="$(pnpm exec pulumi stack output databaseMigrationUrl --show-secrets --cwd packages/infra --stack "$PULUMI_STACK")"
          test -n "$database_migration_url"
          echo "::add-mask::$database_migration_url"
          export DATABASE_MIGRATION_URL="$database_migration_url"
          node packages/app/scripts/check-design-v2-compatibility.ts
      - name: Authenticate Docker to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preview application deployment
        run: |
          if ! pnpm exec pulumi preview --cwd packages/infra --stack "$PULUMI_STACK" --non-interactive --json > "$RUNNER_TEMP/preview.json"; then
            jq -r '.. | objects | select(.severity? == "error") | .message? // empty' "$RUNNER_TEMP/preview.json"
            exit 1
          fi
      - name: Guard application deployment
        run: node .github/scripts/guard-pulumi-preview.mjs "$RUNNER_TEMP/preview.json"
      - name: Update production stack
        run: pnpm exec pulumi up --cwd packages/infra --stack "$PULUMI_STACK" --non-interactive --yes
      - name: Verify anonymous GHCR image access
        run: |
          deployed_image="$(pnpm exec pulumi stack output deployedImage --cwd packages/infra --stack "$PULUMI_STACK")"
          case "$deployed_image" in
            ghcr.io/eastsun5566/vibelog-app:pulumi-prod@sha256:*) ;;
            *) echo "::error::Unexpected deployed image: $deployed_image"; exit 1 ;;
          esac
          docker logout ghcr.io
          docker buildx imagetools inspect "$deployed_image"
      - name: Smoke test Cloud Run and apex edge routing
        run: |
          web_url="$(pnpm exec pulumi stack output webUrl --cwd packages/infra --stack "$PULUMI_STACK")"
          root_domain="$(pnpm exec pulumi config get vibelog:rootDomain --cwd packages/infra --stack "$PULUMI_STACK")"
          curl --fail --show-error --retry 6 --retry-all-errors --max-time 20 "$web_url/health"
          curl --fail --show-error --retry 6 --retry-all-errors --max-time 20 "https://${root_domain}/health"
      - name: Smoke test private worker through Cloud Tasks
        if: steps.maintenance.outputs.value != 'locked'
        run: |
          database_migration_url="$(pnpm exec pulumi stack output databaseMigrationUrl --show-secrets --cwd packages/infra --stack "$PULUMI_STACK")"
          test -n "$database_migration_url"
          echo "::add-mask::$database_migration_url"
          export DATABASE_MIGRATION_URL="$database_migration_url"
          export WORKER_URL="$(pnpm exec pulumi stack output workerUrl --cwd packages/infra --stack "$PULUMI_STACK")"
          export CLOUD_TASKS_QUEUE_PATH="$(pnpm exec pulumi stack output taskQueuePath --cwd packages/infra --stack "$PULUMI_STACK")"
          export CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL="$(pnpm exec pulumi stack output taskInvokerEmail --cwd packages/infra --stack "$PULUMI_STACK")"
          node packages/app/scripts/worker-smoke.ts
