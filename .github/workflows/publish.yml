name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-vibelog-prod
  cancel-in-progress: false

env:
  GCP_REGION: asia-east1
  PULUMI_STACK: EastSun5566/vibelog/prod
  PULUMI_ENABLE_STREAMING_JSON_PREVIEW: "true"
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Require successful CI for the selected main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_passed="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$DEPLOY_SHA" -F per_page=1 \
            --jq '.workflow_runs[0] | .status == "completed" and .conclusion == "success"')"
          if test "$ci_passed" != true; then
            echo "::error::CI must finish successfully for ${DEPLOY_SHA} on main before deployment."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vibelog/core build
      - run: pnpm --filter @vibelog/app build
      - run: pnpm --filter @vibelog/edge build
      - run: pnpm --filter @vibelog/infra build
      - name: Authenticate with Pulumi Cloud using GitHub OIDC
        uses: pulumi/auth-actions@v2
        with:
          organization: EastSun5566
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:EastSun5566
      - name: Load short-lived GCP credentials and secrets from ESC
        uses: pulumi/esc-action@v3
        with:
          environment: EastSun5566/vibelog/prod
      - name: Validate deployment environment
        run: |
          test "$(pnpm exec pulumi config get vibelog:deploymentPhase --cwd packages/infra --stack "$PULUMI_STACK")" = application
          test -n "$GOOGLE_OAUTH_ACCESS_TOKEN"
      - name: Authenticate Docker to Artifact Registry
        run: printf '%s' "$GOOGLE_OAUTH_ACCESS_TOKEN" | docker login --username oauth2accesstoken --password-stdin "https://${GCP_REGION}-docker.pkg.dev"
      - name: Preview application deployment
        run: pnpm exec pulumi preview --cwd packages/infra --stack "$PULUMI_STACK" --non-interactive --json > "$RUNNER_TEMP/preview.json"
      - name: Guard application deployment
        run: node .github/scripts/guard-pulumi-preview.mjs "$RUNNER_TEMP/preview.json"
      - name: Update production stack
        run: pnpm exec pulumi up --cwd packages/infra --stack "$PULUMI_STACK" --non-interactive --yes
      - name: Smoke test Cloud Run and apex edge routing
        run: |
          web_url="$(pnpm exec pulumi stack output webUrl --cwd packages/infra --stack "$PULUMI_STACK")"
          root_domain="$(pnpm exec pulumi config get vibelog:rootDomain --cwd packages/infra --stack "$PULUMI_STACK")"
          curl --fail --show-error --retry 6 --retry-all-errors --max-time 20 "$web_url/health"
          curl --fail --show-error --retry 6 --retry-all-errors --max-time 20 "https://${root_domain}/health"
      - name: Smoke test private worker through Cloud Tasks
        run: |
          database_migration_url="$(pnpm exec pulumi stack output databaseMigrationUrl --show-secrets --cwd packages/infra --stack "$PULUMI_STACK")"
          test -n "$database_migration_url"
          echo "::add-mask::$database_migration_url"
          export DATABASE_MIGRATION_URL="$database_migration_url"
          export WORKER_URL="$(pnpm exec pulumi stack output workerUrl --cwd packages/infra --stack "$PULUMI_STACK")"
          export CLOUD_TASKS_QUEUE_PATH="$(pnpm exec pulumi stack output taskQueuePath --cwd packages/infra --stack "$PULUMI_STACK")"
          export CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL="$(pnpm exec pulumi stack output taskInvokerEmail --cwd packages/infra --stack "$PULUMI_STACK")"
          node packages/app/scripts/worker-smoke.ts
