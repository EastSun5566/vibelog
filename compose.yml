services:
  app:
    image: ${VIBELOG_APP_IMAGE:-ghcr.io/eastsun5566/vibelog-app:beta}
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_ROOT: /data
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PREVIEW_ORIGIN: ${PREVIEW_ORIGIN:-http://preview.localhost:3000}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      VIBELOG_AI_USER_DAILY_LIMIT: ${VIBELOG_AI_USER_DAILY_LIMIT:-20}
      VIBELOG_AI_GLOBAL_DAILY_LIMIT: ${VIBELOG_AI_GLOBAL_DAILY_LIMIT:-200}
      VIBELOG_AI_PROVIDER: ${VIBELOG_AI_PROVIDER:-openai}
      VIBELOG_AI_MODEL: ${VIBELOG_AI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - app_data:/data
    stop_grace_period: 30s

volumes:
  app_data:
